name: Layers Build

permissions:
  contents: read

on: [ push, pull_request ]

jobs:
  scala:
    runs-on: ubuntu-latest

    env:
      MIMA_FAIL_ON_PROBLEM: ${{ vars.MIMA_FAIL_ON_PROBLEM || 'true' }}

    strategy:
      fail-fast: false
      matrix:
        scalaVersion: [ "2.13.x", "3.3.x" ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          java-version: 25
          distribution: temurin
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409

      - name: Run QA
        run: |
          mkdir ${{ github.workspace }}/target
          sbt "++${{ matrix.scalaVersion }}; qa"
